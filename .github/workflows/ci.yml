name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/exhibit-core.js
          node --check assets/exhibit.js
          node --check assets/exhibit-hopfield.js
          node --check assets/exhibit-causal-goldin.js
          node --check assets/exhibit-growth-generic.js
          node --check assets/exhibit-bootstrap.js
          node --check assets/exhibit-router.js
          node --check assets/learning-recommendation-engine.js
          node --check assets/economics-supabase-config.js
          node --check assets/economics-memory.js
          node --check assets/economics-streaming.js

      - name: Check data pipeline syntax
        run: python -m py_compile scripts/sync_nobel_data.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run Node tests
        run: |
          node --test tests/exhibit-core.test.js
          node --test tests/economics-streaming.test.js
          node --test tests/recommendation-engine.test.js
          node --test tests/economics-memory.test.js
